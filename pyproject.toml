[tool.poetry]
name = "flowgem"
version = "0.1.0"
description = "Nonparametric generative sampling for MAR missing data via approximate Wasserstein gradient flows"
authors = ["Muhammad Haris Mumtaz"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
torch = {version = "^2.13.0", source = "pytorch-cpu"}
numpy = "^2.5.1"
scikit-learn = "^1.9.0"
joblib = "^1.5.3"
tqdm = "^4.68.4"


[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
